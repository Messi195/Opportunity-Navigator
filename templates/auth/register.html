{% extends "base.html" %}

{% block title %}Create an Account{% endblock %}

{% block content %}

<section class="auth-section">

    <form method="post" class="auth-card">

        <p class="eyebrow">Let's get started</p>

        <h1 class="auth-title">Create an Account</h1>

        <label class="field">

            <span>Username</span>

            <input
                type="text"
                name="username"
                autocomplete="username"
                minlength="3"
                autofocus
                required
            >

        </label>

        <label class="field">

            <span>Password</span>

            <input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </label>

        <label class="field">

            <span>Confirm Password</span>

            <input
                type="password"
                name="password2"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </label>

        <button
            type="submit"
            class="btn btn-primary btn-lg btn-block"
        >
            Create Account
        </button>

        <p class="auth-switch">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">Log in</a>

        </p>

    </form>

</section>

{% endblock %}
